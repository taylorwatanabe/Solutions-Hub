<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solutions Hub</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon-32.png?v=2" sizes="32x32" />
  <link rel="icon" type="image/png" href="/favicon.png?v=2" sizes="512x512" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=6" />
</head>
<body>
  <div class="page-watermark" aria-hidden="true">
    <img src="/img/solutions-hub-logo.png?v=5" alt="" />
  </div>
  <div class="app-shell">
    <header class="topbar">
      <div class="logo" aria-label="Sunrun">SUNRUN</div>
      <div class="brand-block">
        <img
          class="brand-logo"
          src="/img/solutions-hub-logo.png?v=5"
          alt=""
          width="120"
          height="66"
        />
        <div class="brand-copy">
          <p class="brand">Solutions Hub</p>
          <p class="tagline">Friction to Solutions — pipeline board</p>
        </div>
      </div>
      <div class="header-spacer" aria-hidden="true"></div>
    </header>

    <section id="view-board" class="view is-active" aria-label="Kanban board">
      <div class="board-toolbar">
        <div class="filter-row">
          <label for="department-filter">Department</label>
          <select id="department-filter">
            <option value="">All departments</option>
          </select>
          <button type="button" id="refresh-board" class="btn ghost">Refresh</button>
        </div>
        <div id="dept-chips" class="dept-chips" aria-live="polite"></div>
      </div>
      <div id="board-error" class="banner error" hidden></div>
      <div id="kanban" class="kanban" role="list"></div>
    </section>

    <section id="view-intake" class="view" aria-label="1-3-1 intake" hidden>
      <div class="intake-wrap">
        <h1>1-3-1 Pitch Intake</h1>
        <p class="lede">Describe the friction, offer three options, and defend one recommendation. Submissions land in <strong>Received</strong> with a 30-day review SLA commitment.</p>
        <form id="intake-form" class="intake-form" novalidate>
          <div class="grid-2">
            <label>Your name
              <input name="submitter_name" type="text" autocomplete="name" />
            </label>
            <label>Work email
              <input name="submitter_email" type="email" autocomplete="email" required />
            </label>
          </div>
          <label>Department
            <input name="department" type="text" list="dept-suggestions" placeholder="e.g. Field Ops, CX, Install" required />
          </label>
          <datalist id="dept-suggestions"></datalist>

          <fieldset>
            <legend>1 — Problem</legend>
            <label>Operational friction
              <textarea name="problem" rows="4" required placeholder="Objective description of the friction point"></textarea>
            </label>
          </fieldset>

          <fieldset>
            <legend>3 — Options</legend>
            <label>Solution A — Quick Win
              <textarea name="option_a" rows="3" required></textarea>
            </label>
            <label>Solution B — Structural Fix
              <textarea name="option_b" rows="3" required></textarea>
            </label>
            <label>Solution C — Innovative Leap
              <textarea name="option_c" rows="3" required></textarea>
            </label>
          </fieldset>

          <fieldset>
            <legend>1 — Recommendation</legend>
            <label>Defended choice &amp; logic
              <textarea name="recommendation" rows="4" required></textarea>
            </label>
            <div class="grid-2">
              <label>Resources needed
                <textarea name="resources" rows="2"></textarea>
              </label>
              <label>Estimated value / ROI
                <textarea name="estimated_value" rows="2"></textarea>
              </label>
            </div>
          </fieldset>

          <div class="form-actions">
            <button type="submit" class="btn primary" id="intake-submit">Submit pitch</button>
            <p id="intake-status" class="form-status" role="status" aria-live="polite"></p>
          </div>
        </form>
      </div>
    </section>
  </div>

  <dialog id="card-dialog">
    <form method="dialog" class="dialog-form" id="card-form">
      <header class="dialog-header">
        <h2 id="dialog-title">Submission</h2>
        <button type="submit" class="btn ghost" value="cancel" aria-label="Close">Close</button>
      </header>
      <div id="dialog-body" class="dialog-body"></div>
      <footer class="dialog-footer">
        <label>Status
          <select id="dialog-status"></select>
        </label>
        <label>Department
          <input id="dialog-department" type="text" />
        </label>
        <label class="full">Coaching notes
          <textarea id="dialog-notes" rows="3"></textarea>
        </label>
        <label>Sprint lead
          <input id="dialog-lead" type="text" />
        </label>
        <div class="dialog-actions">
          <button type="button" class="btn ghost" id="dialog-upvote">Upvote</button>
          <button type="button" class="btn primary" id="dialog-save">Save changes</button>
        </div>
      </footer>
    </form>
  </dialog>

  <script src="/js/app.js?v=6" type="module"></script>
</body>
</html>
